<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy List</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <main class="main">

    <section class="left" aria-label="Список покупок">

      <div class="add-product">
        <label for="product-input" class="visually-hidden">Назва товару</label>
        <input
          type="text"
          id="product-input"
          placeholder="Назва товару"
          class="input-product"
        >
        <button class="add-button" id="add-button" aria-label="Додати товар">
          Додати
        </button>
      </div>

      <ul class="product-list" id="product-list"></ul>

    </section>

    <aside class="right">

      <section class="right-top" aria-label="Залишилося купити">
        <h2>Залишилося</h2>
        <ul class="right-list" id="stat-remaining"></ul>
      </section>

      <section class="right-bottom" aria-label="Куплені товари">
        <h2>Куплено</h2>
        <ul class="right-list" id="stat-bought"></ul>
      </section>

    </aside>

  </main>

  <script src="main.js"></script>
</body>
</html>
